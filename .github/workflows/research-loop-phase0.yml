# Phase 0 falsification spike (frozen spec: docs/research_loop_proof/PHASE0_SPEC.md).
#
# Manual only, one mode per dispatch. No cache is read or written.
#   smoke  = load the content-verified t0-alpha weights, re-run the ridge calibration, time t0 and check one
#            forecast is finite. No skill is computed. No AI call.
#   phaseA = the instrument test: t0 and the matched ridge on the frozen worlds; verdict PASS or
#            INSTRUMENT FEASIBILITY FAILED (or an integrity failure, which is no verdict). No AI call.
#   phaseB = one hidden world (seed from spec_sha and this run's id), only after a published Phase A PASS under the
#            same spec_sha (input phase_a_run). observe exports the observed data only; research runs the scripted
#            strategy and the AI researcher without the truth on disk; evaluate regenerates the truth and scores.
# Results are published only by the publish job, which holds no secret: it checks the files against the hash the
# producing job declared and pushes them to a new orphan branch phase0/run-<run id>, never overwriting one.
name: Research loop Phase 0

on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke = plumbing and timing, no skill; phaseA = the frozen instrument test; phaseB = the hidden-world research test
        type: choice
        required: true
        default: smoke
        options: [smoke, phaseA, phaseB]
      phase_a_run:
        description: phaseB only - the run id of the published Phase A PASS (branch phase0/run-<id>)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: research-loop-phase0
  cancel-in-progress: false

jobs:
  phase_a:
    if: inputs.mode != 'phaseB'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c constraints-ci.txt torch
          pip install --no-cache-dir -r requirements.txt -c constraints-ci.txt pyyaml

      - name: Phase 0 tests (the frozen-file pins included)
        run: python -m pytest tests/test_research_loop_phase0.py -q

      - name: Run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then echo "::error::HF_TOKEN is not visible to this run"; exit 1; fi
          case "$MODE" in
            smoke) arg=smoke ;;
            phaseA) arg=run ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          python -m research_loop_proof.phase0.truth.phase_a --mode "$arg" --out out

      - name: Show the result
        run: |
          if [ -f out/REPORT.md ]; then cat out/REPORT.md; fi
          if [ -f out/smoke.json ]; then cat out/smoke.json; fi

      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: phase0-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  observe:
    if: inputs.mode == 'phaseB'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      observed_sha256: ${{ steps.observe.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -c constraints-ci.txt numpy

      - name: Check the researcher model variable (by its sha256 against menu.json; nothing printed)
        env:
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          pin = json.load(open("research_loop_proof/phase0/lab/menu.json"))["researcher"]["model_sha256"]
          got = hashlib.sha256(os.environ.get("RESEARCHER_MODEL", "").strip().encode()).hexdigest()
          if got != pin:
              sys.exit("vars.RESEARCHER_MODEL does not hash to the pinned researcher model: Phase B refused")
          print("researcher model variable matches the pin")
          PY

      - name: Fetch the published Phase A result
        env:
          PHASE_A_RUN: ${{ inputs.phase_a_run }}
        run: |
          set -euo pipefail
          case "$PHASE_A_RUN" in ''|*[!0-9]*) echo "::error::phase_a_run must be the numeric run id of the Phase A run"; exit 1 ;; esac
          git fetch --depth=1 origin "refs/heads/phase0/run-$PHASE_A_RUN"
          mkdir phase_a
          git show FETCH_HEAD:verdict.json > phase_a/verdict.json
          git show FETCH_HEAD:MANIFEST.sha256 > phase_a/MANIFEST.sha256
          cat phase_a/verdict.json

      - name: Observe (refuses unless Phase A passed under this spec_sha)
        id: observe
        run: |
          set -euo pipefail
          python -m research_loop_proof.phase0.truth.observe --run-id "$GITHUB_RUN_ID" --phase-a-dir phase_a --out obs
          echo "sha=$(python -c 'import json; print(json.load(open("obs/observed.json"))["arrays_sha256"])')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: phase0-observed-${{ github.run_id }}
          path: obs/
          if-no-files-found: error
          retention-days: 30

  research:
    needs: [observe]
    if: inputs.mode == 'phaseB'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research_loop_proof/phase0/truth/

      - name: Guard (the truth is not in this job)
        run: |
          set -euo pipefail
          if [ -e research_loop_proof/phase0/truth ]; then echo "::error::research_loop_proof/phase0/truth is present"; exit 1; fi
          rm -rf .git
          if grep -rl --include='*.py' 'def make_world' . ; then echo "::error::generator code is present"; exit 1; fi
          mkdir -p research
          printf '{"truth_absent": true, "git_removed": true}\n' > research/guard.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c constraints-ci.txt torch
          pip install --no-cache-dir -r requirements.txt -c constraints-ci.txt
          pip install --no-cache-dir -r requirements-researcher.txt

      - uses: actions/download-artifact@v4
        with:
          name: phase0-observed-${{ github.run_id }}
          path: obs

      - name: Weights (HF_TOKEN only here)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m research_loop_proof.phase0.lab.run weights --weights weights

      - name: Scripted strategy (no secrets; weights offline)
        env:
          HF_HUB_OFFLINE: "1"
          OBS_SHA: ${{ needs.observe.outputs.observed_sha256 }}
        run: python -m research_loop_proof.phase0.lab.run scripted --observed obs/observed.npz --observed-sha "$OBS_SHA" --weights weights --out research

      - name: AI researcher (the API key only here; weights offline)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          HF_HUB_OFFLINE: "1"
          OBS_SHA: ${{ needs.observe.outputs.observed_sha256 }}
        run: python -m research_loop_proof.phase0.lab.run loop --observed obs/observed.npz --observed-sha "$OBS_SHA" --weights weights --out research

      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          cd research
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: phase0-research-${{ github.run_id }}
          path: research/
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [observe, research]
    if: ${{ !cancelled() && inputs.mode == 'phaseB' && needs.observe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c constraints-ci.txt torch
          pip install --no-cache-dir -r requirements.txt -c constraints-ci.txt

      - name: Fetch the published Phase A result
        env:
          PHASE_A_RUN: ${{ inputs.phase_a_run }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/heads/phase0/run-$PHASE_A_RUN"
          mkdir phase_a
          git show FETCH_HEAD:verdict.json > phase_a/verdict.json
          git show FETCH_HEAD:MANIFEST.sha256 > phase_a/MANIFEST.sha256

      - uses: actions/download-artifact@v4
        with:
          name: phase0-observed-${{ github.run_id }}
          path: obs

      - uses: actions/download-artifact@v4
        if: needs.research.result == 'success'
        with:
          name: phase0-research-${{ github.run_id }}
          path: research

      - name: Check the research record against the hash its job declared
        if: needs.research.result == 'success'
        env:
          DECLARED: ${{ needs.research.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd research
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::research manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256

      - name: Weights (HF_TOKEN only here)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m research_loop_proof.phase0.lab.run weights --weights weights

      - name: Evaluate (weights offline)
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          set -euo pipefail
          mkdir -p research
          python -m research_loop_proof.phase0.truth.evaluate --run-id "$GITHUB_RUN_ID" --phase-a-dir phase_a --observed obs --research research --weights weights --out out
          cat out/REPORT.md

      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: phase0-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [phase_a, evaluate]
    if: ${{ !cancelled() && (needs.phase_a.result == 'success' || needs.evaluate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase0-${{ github.run_id }}
          path: branch

      - name: Check the files against the hash the producing job declared
        env:
          DECLARED: ${{ needs.phase_a.outputs.manifest_sha256 || needs.evaluate.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd branch
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256
          listed=$(cut -c67- MANIFEST.sha256 | LC_ALL=C sort)
          present=$(find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort)
          [ "$listed" = "$present" ] || { echo "::error::the files differ from the manifest"; exit 1; }

      - name: Push to a new orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: phase0/run-${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          set +e
          git -c http.extraheader="$auth" ls-remote --exit-code --heads "https://github.com/$REPO.git" "refs/heads/$BRANCH" > /dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "::error::$BRANCH already exists; nothing is overwritten"; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "::error::git ls-remote failed (exit $rc)"; exit 1; fi
          cd branch
          printf '# Phase 0, %s: run %s\n\nProduced by `.github/workflows/research-loop-phase0.yml` at commit `%s`.\nEvery other file is listed with its sha256 in `MANIFEST.sha256`; the publish job checked them against the\nhash the producing job declared. Nothing on this branch is ever overwritten.\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_SHA" > README.md
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Phase 0 $MODE: run $GITHUB_RUN_ID"
          git -c http.extraheader="$auth" push "https://github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
          echo "pushed $(git rev-parse HEAD) to $BRANCH"
