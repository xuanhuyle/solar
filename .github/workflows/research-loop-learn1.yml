# learn1 (docs/research_loop_proof/NEXT_LEARNING_MILESTONE_PROMPT.md): one portable lesson from the beta1 failure,
# then one hidden world researched twice, fresh (F) and with the lesson (L).
#
# Manual only, one mode per dispatch. No cache is read or written. t0-beta jobs install
# research_loop_proof/beta1/constraints-beta.txt (tfc-t0 0.5.0), as beta1 did.
#   lesson    = the one lesson-distillation call, from the beta1 scored record (branch beta1/run-37201189113) only.
#               No world exists yet: the world's seed hashes the frozen lesson.
#   preflight = both conditions on a non-scored world (operational check only: valid answers, legal experiments, no
#               repeated refusals), with the scored run's model, effort, schema, system texts, interface and notebook.
#   run       = the one scored hidden world (seed from learn1_spec_sha and this run's id), only after a published
#               preflight PASS under the same learn1_spec_sha (input preflight_run). observe exports days 1-126 only;
#               research_f and research_l (identical except for the condition, in parallel, without any truth on disk)
#               run the two researchers; evaluate scores both.
# Results are published only by the publish job, which holds no secret: it checks the files against the hash the
# producing job declared and pushes them to a new orphan branch learn1/run-<run id>, never overwriting one.
name: Research loop learn1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: lesson = the lesson call (no world); preflight = non-scored check of both conditions; run = the one scored paired world
        type: choice
        required: true
        default: lesson
        options: [lesson, preflight, run]
      preflight_run:
        description: run only - the run id of the published preflight PASS (branch learn1/run-<id>)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: research-loop-learn1
  cancel-in-progress: false

jobs:
  lesson:
    if: inputs.mode == 'lesson'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (no forecasting stack)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt numpy pandas
          pip install --no-cache-dir -r requirements-researcher.txt

      - name: Fetch the beta1 scored record (its ai.json is pinned by sha256 in the code)
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/beta1/run-37201189113
          mkdir beta1
          git show FETCH_HEAD:ai.json > beta1/ai.json
          git show FETCH_HEAD:MANIFEST.sha256 > beta1/MANIFEST.sha256

      - name: Distil the lesson (the API key only here)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
        run: python -m research_loop_proof.learn1.lesson --beta1 beta1 --out out

      - name: Show the result
        run: cat out/REPORT.md

      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: learn1-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  observe:
    if: inputs.mode == 'preflight' || inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      observed_sha256: ${{ steps.observe.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt numpy pandas

      - name: Check the researcher model variable (by its sha256 against menu.json; nothing printed)
        env:
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          pin = json.load(open("research_loop_proof/phase0/lab/menu.json"))["researcher"]["model_sha256"]
          got = hashlib.sha256(os.environ.get("RESEARCHER_MODEL", "").strip().encode()).hexdigest()
          if got != pin:
              sys.exit("vars.RESEARCHER_MODEL does not hash to the pinned researcher model: refused")
          print("researcher model variable matches the pin")
          PY

      - name: Fetch the published preflight result (run mode)
        if: inputs.mode == 'run'
        env:
          PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        run: |
          set -euo pipefail
          case "$PREFLIGHT_RUN" in ''|*[!0-9]*) echo "::error::preflight_run must be the numeric run id of the preflight"; exit 1 ;; esac
          git fetch --depth=1 origin "refs/heads/learn1/run-$PREFLIGHT_RUN"
          mkdir preflight
          git show FETCH_HEAD:verdict.json > preflight/verdict.json
          git show FETCH_HEAD:MANIFEST.sha256 > preflight/MANIFEST.sha256
          cat preflight/verdict.json

      - name: Observe
        id: observe
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python -m research_loop_proof.learn1.truth.observe --mode "$MODE" --run-id "$GITHUB_RUN_ID" --preflight-dir preflight --out obs
          echo "sha=$(python -c 'import json; print(json.load(open("obs/observed.json"))["arrays_sha256"])')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: learn1-observed-${{ github.run_id }}
          path: obs/
          if-no-files-found: error
          retention-days: 30

  research_f:
    needs: [observe]
    if: inputs.mode == 'preflight' || inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research_loop_proof/phase0/truth/
            !/research_loop_proof/beta1/truth/
            !/research_loop_proof/learn1/truth/
            !/tests/

      - name: Guard (no world generator or evaluator in this job)
        run: |
          set -euo pipefail
          for d in research_loop_proof/phase0/truth research_loop_proof/beta1/truth research_loop_proof/learn1/truth tests; do
            if [ -e "$d" ]; then echo "::error::$d is present"; exit 1; fi
          done
          rm -rf .git
          if grep -rlE --include='*.py' '^def make_world\(' . ; then echo "::error::generator code is present"; exit 1; fi
          mkdir -p research
          printf '{"truth_absent": true, "git_removed": true}\n' > research/guard.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (tfc-t0 0.5.0)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c research_loop_proof/beta1/constraints-beta.txt torch
          pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt tfc-t0 numpy pandas pyarrow matplotlib requests huggingface-hub safetensors pytest pyyaml
          pip install --no-cache-dir -r requirements-researcher.txt

      - uses: actions/download-artifact@v4
        with:
          name: learn1-observed-${{ github.run_id }}
          path: obs

      - name: Weights (t0-beta, pinned bytes; ungated, no secret)
        run: python -m research_loop_proof.learn1.lab.run weights --weights weights

      - name: AI researcher, condition F (the API key only here; weights offline)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          HF_HUB_OFFLINE: "1"
          OBS_SHA: ${{ needs.observe.outputs.observed_sha256 }}
        run: python -m research_loop_proof.learn1.lab.run loop --condition F --observed obs/observed.npz --observed-sha "$OBS_SHA" --weights weights --out research

      - name: Manifest
        id: manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research
          cd research
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn1-research-F-${{ github.run_id }}
          path: research/
          if-no-files-found: error
          retention-days: 30

  research_l:
    needs: [observe]
    if: inputs.mode == 'preflight' || inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research_loop_proof/phase0/truth/
            !/research_loop_proof/beta1/truth/
            !/research_loop_proof/learn1/truth/
            !/tests/

      - name: Guard (no world generator or evaluator in this job)
        run: |
          set -euo pipefail
          for d in research_loop_proof/phase0/truth research_loop_proof/beta1/truth research_loop_proof/learn1/truth tests; do
            if [ -e "$d" ]; then echo "::error::$d is present"; exit 1; fi
          done
          rm -rf .git
          if grep -rlE --include='*.py' '^def make_world\(' . ; then echo "::error::generator code is present"; exit 1; fi
          mkdir -p research
          printf '{"truth_absent": true, "git_removed": true}\n' > research/guard.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (tfc-t0 0.5.0)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c research_loop_proof/beta1/constraints-beta.txt torch
          pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt tfc-t0 numpy pandas pyarrow matplotlib requests huggingface-hub safetensors pytest pyyaml
          pip install --no-cache-dir -r requirements-researcher.txt

      - uses: actions/download-artifact@v4
        with:
          name: learn1-observed-${{ github.run_id }}
          path: obs

      - name: Weights (t0-beta, pinned bytes; ungated, no secret)
        run: python -m research_loop_proof.learn1.lab.run weights --weights weights

      - name: AI researcher, condition L (the API key only here; weights offline)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          HF_HUB_OFFLINE: "1"
          OBS_SHA: ${{ needs.observe.outputs.observed_sha256 }}
        run: python -m research_loop_proof.learn1.lab.run loop --condition L --observed obs/observed.npz --observed-sha "$OBS_SHA" --weights weights --out research

      - name: Manifest
        id: manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research
          cd research
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn1-research-L-${{ github.run_id }}
          path: research/
          if-no-files-found: error
          retention-days: 30

  check:
    needs: [observe, research_f, research_l]
    if: ${{ !cancelled() && inputs.mode == 'preflight' && needs.observe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt numpy pandas

      - uses: actions/download-artifact@v4
        with:
          name: learn1-observed-${{ github.run_id }}
          path: obs

      - uses: actions/download-artifact@v4
        if: needs.research_f.outputs.manifest_sha256 != ''
        with:
          name: learn1-research-F-${{ github.run_id }}
          path: research/F

      - name: Check the condition F record against the hash its job declared
        if: needs.research_f.outputs.manifest_sha256 != ''
        env:
          DECLARED: ${{ needs.research_f.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd research/F
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::research F manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256

      - uses: actions/download-artifact@v4
        if: needs.research_l.outputs.manifest_sha256 != ''
        with:
          name: learn1-research-L-${{ github.run_id }}
          path: research/L

      - name: Check the condition L record against the hash its job declared
        if: needs.research_l.outputs.manifest_sha256 != ''
        env:
          DECLARED: ${{ needs.research_l.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd research/L
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::research L manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256

      - name: Preflight check (operational only, both conditions)
        run: |
          set -euo pipefail
          mkdir -p research/F research/L
          python -m research_loop_proof.learn1.truth.preflight --research research --observed obs --out out
          cat out/REPORT.md

      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: learn1-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [observe, research_f, research_l]
    if: ${{ !cancelled() && inputs.mode == 'run' && needs.observe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (tfc-t0 0.5.0)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c research_loop_proof/beta1/constraints-beta.txt torch
          pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt tfc-t0 numpy pandas pyarrow matplotlib requests huggingface-hub safetensors pytest pyyaml

      - uses: actions/download-artifact@v4
        with:
          name: learn1-observed-${{ github.run_id }}
          path: obs

      - uses: actions/download-artifact@v4
        if: needs.research_f.outputs.manifest_sha256 != ''
        with:
          name: learn1-research-F-${{ github.run_id }}
          path: research/F

      - name: Check the condition F record against the hash its job declared
        if: needs.research_f.outputs.manifest_sha256 != ''
        env:
          DECLARED: ${{ needs.research_f.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd research/F
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::research F manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256

      - uses: actions/download-artifact@v4
        if: needs.research_l.outputs.manifest_sha256 != ''
        with:
          name: learn1-research-L-${{ github.run_id }}
          path: research/L

      - name: Check the condition L record against the hash its job declared
        if: needs.research_l.outputs.manifest_sha256 != ''
        env:
          DECLARED: ${{ needs.research_l.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd research/L
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::research L manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256

      - name: Weights (t0-beta, pinned bytes; ungated, no secret)
        run: python -m research_loop_proof.learn1.lab.run weights --weights weights

      - name: Evaluate (weights offline)
        env:
          HF_HUB_OFFLINE: "1"
          RESULT_F: ${{ needs.research_f.result }}
          RESULT_L: ${{ needs.research_l.result }}
        run: |
          set -euo pipefail
          mkdir -p research/F research/L
          python -m research_loop_proof.learn1.truth.evaluate --run-id "$GITHUB_RUN_ID" --observed obs --research research --weights weights --out out --research-f-result "$RESULT_F" --research-l-result "$RESULT_L"
          cat out/REPORT.md

      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: learn1-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [lesson, check, evaluate]
    if: ${{ !cancelled() && (needs.lesson.result == 'success' || needs.check.result == 'success' || needs.evaluate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: learn1-${{ github.run_id }}
          path: branch

      - name: Check the files against the hash the producing job declared
        env:
          DECLARED: ${{ needs.lesson.outputs.manifest_sha256 || needs.check.outputs.manifest_sha256 || needs.evaluate.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd branch
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256
          listed=$(cut -c67- MANIFEST.sha256 | LC_ALL=C sort)
          present=$(find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort)
          [ "$listed" = "$present" ] || { echo "::error::the files differ from the manifest"; exit 1; }

      - name: Push to a new orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: learn1/run-${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          set +e
          git -c http.extraheader="$auth" ls-remote --exit-code --heads "https://github.com/$REPO.git" "refs/heads/$BRANCH" > /dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "::error::$BRANCH already exists; nothing is overwritten"; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "::error::git ls-remote failed (exit $rc)"; exit 1; fi
          cd branch
          printf '# learn1, %s: run %s\n\nProduced by `.github/workflows/research-loop-learn1.yml` at commit `%s`.\nEvery other file is listed with its sha256 in `MANIFEST.sha256`; the publish job checked them against the\nhash the producing job declared. Nothing on this branch is ever overwritten.\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_SHA" > README.md
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "learn1 $MODE: run $GITHUB_RUN_ID"
          git -c http.extraheader="$auth" push "https://github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
          echo "pushed $(git rev-parse HEAD) to $BRANCH"
