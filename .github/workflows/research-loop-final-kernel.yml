      - name: Weights (t0-beta, pinned bytes; ungated, no secret)
        run: python -m research_loop_proof.final_kernel.lab.run weights --weights weights

      - name: AI researcher (L8 with context and memory as data), e1_c2 (the API key only here; weights offline)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          HF_HUB_OFFLINE: "1"
          OBS_SHA: ${{ needs.observe.outputs.c2e1_obs }}
          CTX_SHA: ${{ needs.observe.outputs.c2e1_ctx }}
        run: |
          set -euo pipefail
          start=$(date -u +%s)
          python -m research_loop_proof.final_kernel.lab.run loop --condition E1 --observed obs/observed.npz --observed-sha "$OBS_SHA" --context obs/context.txt --context-sha "$CTX_SHA" --weights weights --out research
          end=$(date -u +%s)
          printf '{"loop_started_unix": %s, "loop_finished_unix": %s, "loop_wall_s": %s}\n' "$start" "$end" "$((end - start))" > research/timing.json

      - name: Manifest
        id: manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research
          cd research
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fk-research-e1_c2-${{ github.run_id }}
          path: research/
          if-no-files-found: error
          retention-days: 30

  e1_c3:
    needs: [observe]
    if: ${{ !cancelled() && needs.observe.result == 'success' && inputs.mode == 'run' }}
    runs-on: ubuntu-latest
