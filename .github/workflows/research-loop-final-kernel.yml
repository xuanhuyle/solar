# Final kernel (docs/research_loop_proof/NEXT_FINAL_KERNEL_PROMPT.md): company context + Discovery1's researcher L8
# (system text byte-identical) + pinned t0-beta + a deterministic referee + validated research memory, on four
# synthetic companies with three sequential study periods each (FINAL_KERNEL_SPEC.md).
#
# Manual only, one mode per dispatch. No cache is read or written. t0-beta jobs install
# research_loop_proof/beta1/constraints-beta.txt (tfc-t0 0.5.0), as the earlier milestones did.
#   preflight = one non-scored company (c1) through the whole chain: E1, referee, E2-F, E2-K, referee, E3-F, E3-K,
#               then the operational check (execution, schema, prompt rebuild with context and memory, memory plumbing).
#   run       = the four scored companies (designs and seeds from final_kernel_spec_sha and this run's id), only after a
#               published preflight PASS under the same spec, only as the run's first attempt and only if no scored
#               final-kernel run is published.
# Research jobs (no truth on disk, the API key only in the loop step) download only their own study period's observed
# data and context; K jobs also their company's memory, written by the truth-free referee jobs. At most four
# researcher jobs run at once. evaluate reads everything; publish holds no secret and pushes a new orphan branch
# final-kernel/run-<run id>, never overwriting one.
name: Research loop final kernel
run-name: final-kernel ${{ inputs.mode }} ${{ inputs.preflight_run }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preflight = non-scored operational chain (one company); run = the frozen four-company batch
        type: choice
        required: true
        default: preflight
        options: [preflight, run]
      preflight_run:
        description: run only - the run id of the published preflight PASS (branch final-kernel/run-<id>)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: research-loop-final-kernel
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      c1e1_obs: ${{ steps.observe.outputs.c1e1_obs }}
      c1e1_ctx: ${{ steps.observe.outputs.c1e1_ctx }}
      c1e1_hold: ${{ steps.observe.outputs.c1e1_hold }}
      c1e2_obs: ${{ steps.observe.outputs.c1e2_obs }}
      c1e2_ctx: ${{ steps.observe.outputs.c1e2_ctx }}
      c1e2_hold: ${{ steps.observe.outputs.c1e2_hold }}
      c1e3_obs: ${{ steps.observe.outputs.c1e3_obs }}
      c1e3_ctx: ${{ steps.observe.outputs.c1e3_ctx }}
      c1e3_hold: ${{ steps.observe.outputs.c1e3_hold }}
      c2e1_obs: ${{ steps.observe.outputs.c2e1_obs }}
      c2e1_ctx: ${{ steps.observe.outputs.c2e1_ctx }}
      c2e1_hold: ${{ steps.observe.outputs.c2e1_hold }}
      c2e2_obs: ${{ steps.observe.outputs.c2e2_obs }}
      c2e2_ctx: ${{ steps.observe.outputs.c2e2_ctx }}
      c2e2_hold: ${{ steps.observe.outputs.c2e2_hold }}
      c2e3_obs: ${{ steps.observe.outputs.c2e3_obs }}
      c2e3_ctx: ${{ steps.observe.outputs.c2e3_ctx }}
      c2e3_hold: ${{ steps.observe.outputs.c2e3_hold }}
      c3e1_obs: ${{ steps.observe.outputs.c3e1_obs }}
      c3e1_ctx: ${{ steps.observe.outputs.c3e1_ctx }}
      c3e1_hold: ${{ steps.observe.outputs.c3e1_hold }}
      c3e2_obs: ${{ steps.observe.outputs.c3e2_obs }}
      c3e2_ctx: ${{ steps.observe.outputs.c3e2_ctx }}
      c3e2_hold: ${{ steps.observe.outputs.c3e2_hold }}
      c3e3_obs: ${{ steps.observe.outputs.c3e3_obs }}
      c3e3_ctx: ${{ steps.observe.outputs.c3e3_ctx }}
      c3e3_hold: ${{ steps.observe.outputs.c3e3_hold }}
      c4e1_obs: ${{ steps.observe.outputs.c4e1_obs }}
      c4e1_ctx: ${{ steps.observe.outputs.c4e1_ctx }}
      c4e1_hold: ${{ steps.observe.outputs.c4e1_hold }}
      c4e2_obs: ${{ steps.observe.outputs.c4e2_obs }}
      c4e2_ctx: ${{ steps.observe.outputs.c4e2_ctx }}
      c4e2_hold: ${{ steps.observe.outputs.c4e2_hold }}
      c4e3_obs: ${{ steps.observe.outputs.c4e3_obs }}
      c4e3_ctx: ${{ steps.observe.outputs.c4e3_ctx }}
      c4e3_hold: ${{ steps.observe.outputs.c4e3_hold }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt numpy pandas

      - name: Check the researcher model variable (by its sha256 against menu.json; nothing printed)
        env:
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          pin = json.load(open("research_loop_proof/phase0/lab/menu.json"))["researcher"]["model_sha256"]
          got = hashlib.sha256(os.environ.get("RESEARCHER_MODEL", "").strip().encode()).hexdigest()
          if got != pin:
              sys.exit("vars.RESEARCHER_MODEL does not hash to the pinned researcher model: refused")
          print("researcher model variable matches the pin")
          PY

      - name: Fetch the published preflight result and every published final-kernel verdict (run mode)
        if: inputs.mode == 'run'
        env:
          PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        run: |
          set -euo pipefail
          case "$PREFLIGHT_RUN" in ''|*[!0-9]*) echo "::error::preflight_run must be the numeric run id of the preflight"; exit 1 ;; esac
          git fetch --depth=1 origin "refs/heads/final-kernel/run-$PREFLIGHT_RUN"
          mkdir preflight published
          git show FETCH_HEAD:verdict.json > preflight/verdict.json
          git show FETCH_HEAD:MANIFEST.sha256 > preflight/MANIFEST.sha256
          cat preflight/verdict.json
          refs=$(git ls-remote --exit-code --heads origin 'refs/heads/final-kernel/run-*' | cut -f2)
          for ref in $refs; do
            id="${ref#refs/heads/final-kernel/run-}"
            git fetch --depth=1 origin "$ref"
            mkdir -p "published/$id"
            git show FETCH_HEAD:verdict.json > "published/$id/verdict.json"
          done
          ls published

      - name: Observe
        id: observe
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python -m research_loop_proof.final_kernel.truth.observe --mode "$MODE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --preflight-dir preflight --published-dir published --out fk
          cat fk/shas.env >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fk-observed-c1e1-${{ github.run_id }}
          path: fk/obs/c1e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: fk-holdout-c1e1-${{ github.run_id }}
          path: fk/holdout/c1e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: fk-observed-c1e2-${{ github.run_id }}
          path: fk/obs/c1e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: fk-holdout-c1e2-${{ github.run_id }}
          path: fk/holdout/c1e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: fk-observed-c1e3-${{ github.run_id }}
          path: fk/obs/c1e3/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: fk-holdout-c1e3-${{ github.run_id }}
          path: fk/holdout/c1e3/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c2e1-${{ github.run_id }}
          path: fk/obs/c2e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c2e1-${{ github.run_id }}
          path: fk/holdout/c2e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c2e2-${{ github.run_id }}
          path: fk/obs/c2e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c2e2-${{ github.run_id }}
          path: fk/holdout/c2e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c2e3-${{ github.run_id }}
          path: fk/obs/c2e3/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c2e3-${{ github.run_id }}
          path: fk/holdout/c2e3/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c3e1-${{ github.run_id }}
          path: fk/obs/c3e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c3e1-${{ github.run_id }}
          path: fk/holdout/c3e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c3e2-${{ github.run_id }}
          path: fk/obs/c3e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c3e2-${{ github.run_id }}
          path: fk/holdout/c3e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c3e3-${{ github.run_id }}
          path: fk/obs/c3e3/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c3e3-${{ github.run_id }}
          path: fk/holdout/c3e3/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c4e1-${{ github.run_id }}
          path: fk/obs/c4e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c4e1-${{ github.run_id }}
          path: fk/holdout/c4e1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c4e2-${{ github.run_id }}
          path: fk/obs/c4e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c4e2-${{ github.run_id }}
          path: fk/holdout/c4e2/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-observed-c4e3-${{ github.run_id }}
          path: fk/obs/c4e3/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: fk-holdout-c4e3-${{ github.run_id }}
          path: fk/holdout/c4e3/
          if-no-files-found: error
          retention-days: 30

  e1_c1:
    needs: [observe]
    if: ${{ !cancelled() && needs.observe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research_loop_proof/phase0/truth/
            !/research_loop_proof/beta1/truth/
            !/research_loop_proof/learn1/truth/
            !/research_loop_proof/policy1/truth/
            !/research_loop_proof/discovery1/truth/
            !/research_loop_proof/human1/truth/
            !/research_loop_proof/kernel1/truth/
            !/research_loop_proof/final_kernel/truth/
            !/tests/

      - name: Guard (no world generator or evaluator in this job)
        run: |
          set -euo pipefail
          for d in research_loop_proof/phase0/truth research_loop_proof/beta1/truth research_loop_proof/learn1/truth research_loop_proof/policy1/truth research_loop_proof/discovery1/truth research_loop_proof/human1/truth research_loop_proof/kernel1/truth research_loop_proof/final_kernel/truth tests; do
            if [ -e "$d" ]; then echo "::error::$d is present"; exit 1; fi
          done
          rm -rf .git
          if grep -rlE --include='*.py' '^def (make_world|pair_world|kernel_world|episode_world)' . ; then echo "::error::generator code is present"; exit 1; fi
          mkdir -p research
          printf '{"truth_absent": true, "git_removed": true, "run_attempt": "%s"}\n' "$GITHUB_RUN_ATTEMPT" > research/guard.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (tfc-t0 0.5.0)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c research_loop_proof/beta1/constraints-beta.txt torch
          pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt tfc-t0 numpy pandas pyarrow matplotlib requests huggingface-hub safetensors pytest pyyaml
          pip install --no-cache-dir -r requirements-researcher.txt

      - uses: actions/download-artifact@v4
        with:
          name: fk-observed-c1e1-${{ github.run_id }}
          path: obs

      - name: Weights (t0-beta, pinned bytes; ungated, no secret)
        run: python -m research_loop_proof.final_kernel.lab.run weights --weights weights

      - name: AI researcher (L8 with context and memory as data), e1_c1 (the API key only here; weights offline)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          HF_HUB_OFFLINE: "1"
          OBS_SHA: ${{ needs.observe.outputs.c1e1_obs }}
          CTX_SHA: ${{ needs.observe.outputs.c1e1_ctx }}
        run: |
          set -euo pipefail
          start=$(date -u +%s)
          python -m research_loop_proof.final_kernel.lab.run loop --condition E1 --observed obs/observed.npz --observed-sha "$OBS_SHA" --context obs/context.txt --context-sha "$CTX_SHA" --weights weights --out research
          end=$(date -u +%s)
          printf '{"loop_started_unix": %s, "loop_finished_unix": %s, "loop_wall_s": %s}\n' "$start" "$end" "$((end - start))" > research/timing.json

      - name: Manifest
        id: manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research
          cd research
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fk-research-e1_c1-${{ github.run_id }}
          path: research/
          if-no-files-found: error
          retention-days: 30

