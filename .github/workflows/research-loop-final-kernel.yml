        with:
          name: fk-research-e1_c1-${{ github.run_id }}
          path: research/e1_c1

      - name: Check the e1_c1 record against the hash its job declared
        if: needs.e1_c1.outputs.manifest_sha256 != ''
        env:
          DECLARED: ${{ needs.e1_c1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd research/e1_c1
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::research e1_c1 manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256

      - uses: actions/download-artifact@v4
        if: needs.e2f_c1.outputs.manifest_sha256 != ''
        with:
          name: fk-research-e2f_c1-${{ github.run_id }}
          path: research/e2f_c1

