        with:
          name: fk-memory-c1-e2-${{ github.run_id }}
          path: memory/c1-e2

      - uses: actions/download-artifact@v4
        if: needs.referee_e2.result == 'success'
        with:
          name: fk-memory-c2-e2-${{ github.run_id }}
          path: memory/c2-e2

      - uses: actions/download-artifact@v4
        if: needs.referee_e2.result == 'success'
        with:
          name: fk-memory-c3-e2-${{ github.run_id }}
          path: memory/c3-e2

      - uses: actions/download-artifact@v4
        if: needs.referee_e2.result == 'success'
        with:
          name: fk-memory-c4-e2-${{ github.run_id }}
          path: memory/c4-e2

      - name: Weights (t0-beta, pinned bytes; ungated, no secret)
        run: python -m research_loop_proof.final_kernel.lab.run weights --weights weights

      - name: Evaluate (weights offline)
        env:
          HF_HUB_OFFLINE: "1"
          RESULT_E1_C1: ${{ needs.e1_c1.result }}
          RESULT_E1_C2: ${{ needs.e1_c2.result }}
          RESULT_E1_C3: ${{ needs.e1_c3.result }}
          RESULT_E1_C4: ${{ needs.e1_c4.result }}
          RESULT_E2F_C1: ${{ needs.e2f_c1.result }}
          RESULT_E2F_C2: ${{ needs.e2f_c2.result }}
          RESULT_E2F_C3: ${{ needs.e2f_c3.result }}
          RESULT_E2F_C4: ${{ needs.e2f_c4.result }}
          RESULT_E2K_C1: ${{ needs.e2k_c1.result }}
          RESULT_E2K_C2: ${{ needs.e2k_c2.result }}
          RESULT_E2K_C3: ${{ needs.e2k_c3.result }}
          RESULT_E2K_C4: ${{ needs.e2k_c4.result }}
          RESULT_E3F_C1: ${{ needs.e3f_c1.result }}
          RESULT_E3F_C2: ${{ needs.e3f_c2.result }}
          RESULT_E3F_C3: ${{ needs.e3f_c3.result }}
          RESULT_E3F_C4: ${{ needs.e3f_c4.result }}
          RESULT_E3K_C1: ${{ needs.e3k_c1.result }}
          RESULT_E3K_C2: ${{ needs.e3k_c2.result }}
          RESULT_E3K_C3: ${{ needs.e3k_c3.result }}
          RESULT_E3K_C4: ${{ needs.e3k_c4.result }}
        run: |
          set -euo pipefail
          mkdir -p memory research/e1_c1 research/e1_c2 research/e1_c3 research/e1_c4 research/e2f_c1 research/e2f_c2 research/e2f_c3 research/e2f_c4 research/e2k_c1 research/e2k_c2 research/e2k_c3 research/e2k_c4 research/e3f_c1 research/e3f_c2 research/e3f_c3 research/e3f_c4 research/e3k_c1 research/e3k_c2 research/e3k_c3 research/e3k_c4
          python -m research_loop_proof.final_kernel.truth.evaluate --run-id "$GITHUB_RUN_ID" --observed obs --holdout holdout --research research --memory memory --weights weights --out out --job-result "e1_c1=$RESULT_E1_C1" --job-result "e1_c2=$RESULT_E1_C2" --job-result "e1_c3=$RESULT_E1_C3" --job-result "e1_c4=$RESULT_E1_C4" --job-result "e2f_c1=$RESULT_E2F_C1" --job-result "e2f_c2=$RESULT_E2F_C2" --job-result "e2f_c3=$RESULT_E2F_C3" --job-result "e2f_c4=$RESULT_E2F_C4" --job-result "e2k_c1=$RESULT_E2K_C1" --job-result "e2k_c2=$RESULT_E2K_C2" --job-result "e2k_c3=$RESULT_E2K_C3" --job-result "e2k_c4=$RESULT_E2K_C4" --job-result "e3f_c1=$RESULT_E3F_C1" --job-result "e3f_c2=$RESULT_E3F_C2" --job-result "e3f_c3=$RESULT_E3F_C3" --job-result "e3f_c4=$RESULT_E3F_C4" --job-result "e3k_c1=$RESULT_E3K_C1" --job-result "e3k_c2=$RESULT_E3K_C2" --job-result "e3k_c3=$RESULT_E3K_C3" --job-result "e3k_c4=$RESULT_E3K_C4"
          cat out/REPORT.md

      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fk-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [check, evaluate]
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.evaluate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fk-${{ github.run_id }}
          path: branch

      - name: Check the files against the hash the producing job declared
        env:
          DECLARED: ${{ needs.check.outputs.manifest_sha256 || needs.evaluate.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd branch
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::manifest $got != declared $DECLARED"; exit 1; }
          sha256sum -c MANIFEST.sha256
          listed=$(cut -c67- MANIFEST.sha256 | LC_ALL=C sort)
          present=$(find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort)
          [ "$listed" = "$present" ] || { echo "::error::the files differ from the manifest"; exit 1; }

      - name: Push to a new orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: final-kernel/run-${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          set +e
          git -c http.extraheader="$auth" ls-remote --exit-code --heads "https://github.com/$REPO.git" "refs/heads/$BRANCH" > /dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "::error::$BRANCH already exists; nothing is overwritten"; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "::error::git ls-remote failed (exit $rc)"; exit 1; fi
          cd branch
          printf '# final kernel, %s: run %s\n\nProduced by `.github/workflows/research-loop-final-kernel.yml` at commit `%s`.\nEvery other file is listed with its sha256 in `MANIFEST.sha256`; the publish job checked them against the\nhash the producing job declared. Nothing on this branch is ever overwritten.\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_SHA" > README.md
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "final kernel $MODE: run $GITHUB_RUN_ID"
          git -c http.extraheader="$auth" push "https://github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
          echo "pushed $(git rev-parse HEAD) to $BRANCH"
