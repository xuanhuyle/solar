        if: needs.e2f_c1.outputs.manifest_sha256 != ''
        env:
          DECLARED: ${{ needs.e2f_c1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd research/e2f_c1
          got=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)
          [ "$got" = "$DECLARED" ] || { echo "::error::research e2f_c1 manifest $got != declared $DECLARED"; exit 1; }
