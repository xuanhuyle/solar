# Run the day-ahead solar benchmark on a GitHub runner.
#
# Manual only: the benchmark downloads real RTE data and the gated t0-alpha
# weights, so it is never triggered by a push. Launch it from the Actions tab.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      size:
        description: "Run size: smoke = 5 delivery days, month = 30, full = all of 2024"
        type: choice
        required: true
        default: smoke
        options: [smoke, month, full]
      experiment:
        description: "exp0 = the Experiment 0 benchmark; cov-* = the covariate slice (probe, then known-answer, then run)"
        type: choice
        required: true
        default: exp0
        options: [exp0, cov-probe, cov-known-answer, cov-run, probes-check, probes-run, confirm-dryrun-2024, confirm-2025]

permissions:
  contents: read

concurrency:
  # One benchmark at a time per branch: parallel runs would fight over the
  # data and Hugging Face caches.
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  MODEL_REPO: theforecastingcompany/t0-alpha
  # The weights every reported number was produced with. Unpinned runs would
  # follow the model's `main` branch and silently change under a model update.
  T0_REVISION: 9b02c5f4bb6c89ba15d9fa74554018fe6464220b
  # Bump either version to discard a stale or half-written cache.
  HF_CACHE_VERSION: v1
  DATA_CACHE_VERSION: v1
  WX_CACHE_VERSION: v1
  PROBE_CACHE_VERSION: v1

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # If HF_TOKEN is an *environment* secret rather than a repository one,
    # name that environment here or secrets.HF_TOKEN arrives empty:
    # environment: <environment name>
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only torch wheel first. requirements.txt pulls torch
          # in via tfc-t0, but the default PyPI wheel drags ~3 GB of CUDA
          # packages onto a runner that has no GPU and limited disk.
          # constraints-ci.txt pins the exact versions the published numbers
          # were produced with, so a rerun exercises the same numerical stack.
          pip install --index-url https://download.pytorch.org/whl/cpu -c constraints-ci.txt torch
          pip install -r requirements.txt -c constraints-ci.txt
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check RTE/ODRE connectivity
        run: |
          url="https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/eco2mix-national-cons-def/records?limit=1&select=date_heure,solaire"
          code=$(curl -sS -o /tmp/odre.json -w '%{http_code}' --max-time 60 "$url" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error title=ODRE unreachable::eCO2mix returned HTTP $code. The benchmark cannot download its data; check https://odre.opendatasoft.com status and retry."
            exit 1
          fi
          echo "ODRE reachable (HTTP $code). Sample row:"
          head -c 400 /tmp/odre.json; echo

      - name: Check Open-Meteo connectivity
        if: inputs.experiment != 'exp0'
        run: |
          url="https://previous-runs-api.open-meteo.com/v1/forecast?latitude=48.857&longitude=2.352&hourly=shortwave_radiation_previous_day2&models=ecmwf_ifs025&start_date=2024-06-01&end_date=2024-06-01&timezone=GMT"
          code=$(curl -sS -o /tmp/om.json -w '%{http_code}' --max-time 60 "$url" || echo 000)
          echo "Open-Meteo previous-runs HTTP $code:"; head -c 400 /tmp/om.json; echo
          if [ "$code" != "200" ]; then
            echo "::error title=Open-Meteo unreachable::HTTP $code from the Previous Runs API"
            exit 1
          fi

      - name: Check t0-alpha gated access
        if: inputs.experiment != 'cov-probe' && inputs.experiment != 'probes-check'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN") or None
          if not token:
              # An owner-dispatched run on a branch of this repo (not a fork) does get
              # repository Actions secrets, so an empty value means the secret is not
              # where Actions looks - not that it needs recreating.
              print("::error title=HF_TOKEN not visible to this run::secrets.HF_TOKEN resolved to an "
                    "empty string, so t0-alpha cannot be downloaded. Check, in order: (1) the secret "
                    "is listed under Settings > Secrets and variables > *Actions* - one added under "
                    "the Codespaces or Dependabot tab is invisible here; (2) it is not an "
                    "*Environment* secret, which reaches a job only if that job declares "
                    "'environment:'; (3) the name is exactly HF_TOKEN.")
              sys.exit(1)

          repo = os.environ["MODEL_REPO"]
          revision = os.environ["T0_REVISION"]
          try:
              info = HfApi().model_info(repo, revision=revision, token=token)
          except Exception as exc:
              kind = type(exc).__name__
              if kind == "GatedRepoError":
                  hint = (f"The token is valid but has not been granted access to {repo}. Sign in to "
                          f"https://huggingface.co/{repo} with the token's account and accept the "
                          "model's access conditions.")
              elif kind in ("RepositoryNotFoundError", "HfHubHTTPError"):
                  hint = (f"Could not read {repo} ({kind}). Either the token lacks read access or it has "
                          "expired; regenerate it and update the HF_TOKEN repository secret.")
              else:
                  hint = f"Unexpected {kind} while checking access: {exc}"
              print(f"::error title=t0-alpha access check failed::{hint}")
              sys.exit(1)

          # Identifiers only - never echo the token itself.
          if info.sha != revision:
              print(f"::error title=Pinned revision not found::{repo} resolved {revision} to {info.sha}")
              sys.exit(1)
          print(f"Gated access OK: {info.id} @ {info.sha} (pinned)")
          PY

      - name: Restore Hugging Face cache
        if: inputs.experiment != 'cov-probe' && inputs.experiment != 'probes-check'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.HF_CACHE_VERSION }}-${{ runner.os }}-t0-alpha-${{ env.T0_REVISION }}
          restore-keys: hf-${{ env.HF_CACHE_VERSION }}-${{ runner.os }}-

      - name: Restore RTE data cache
        uses: actions/cache@v4
        with:
          path: data
          key: odre-${{ env.DATA_CACHE_VERSION }}-${{ runner.os }}-2022-01-01_2025-01-01
          restore-keys: odre-${{ env.DATA_CACHE_VERSION }}-${{ runner.os }}-

      - name: Restore weather cache
        if: inputs.experiment != 'exp0'
        uses: actions/cache@v4
        with:
          # Raw Open-Meteo / ODRÉ-regional answers, keyed per run so each run
          # saves what it added; restore-keys pick up the latest earlier one.
          path: wxcache
          key: wx-${{ env.WX_CACHE_VERSION }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: wx-${{ env.WX_CACHE_VERSION }}-${{ runner.os }}-

      - name: Restore probe data cache
        if: startsWith(inputs.experiment, 'probes') || startsWith(inputs.experiment, 'confirm')
        uses: actions/cache@v4
        with:
          # ODRÉ consumption and regional exports for Experiment 3, keyed per run.
          path: probecache
          key: probe-${{ env.PROBE_CACHE_VERSION }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: probe-${{ env.PROBE_CACHE_VERSION }}-${{ runner.os }}-

      - name: Run benchmark
        if: inputs.experiment == 'exp0'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Via the environment, not string interpolation into the shell.
          SIZE: ${{ inputs.size }}
        timeout-minutes: ${{ inputs.size == 'full' && 180 || 45 }}
        run: |
          # An array, so the empty "full" case expands to no argument at all
          # rather than relying on word splitting.
          case "$SIZE" in
            smoke) LIMIT=(--limit-days 5);  SCOPE="5 delivery days" ;;
            month) LIMIT=(--limit-days 30); SCOPE="30 delivery days" ;;
            full)  LIMIT=();                SCOPE="the full 2024 test period" ;;
            *) echo "::error::unknown size '$SIZE'"; exit 1 ;;
          esac
          echo "Running the $SIZE benchmark over $SCOPE with $MODEL_REPO @ $T0_REVISION"
          python run_benchmark.py --repo-id "$MODEL_REPO" --revision "$T0_REVISION" "${LIMIT[@]}"

      - name: Run covariate slice
        if: startsWith(inputs.experiment, 'cov-')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SIZE: ${{ inputs.size }}
          EXPERIMENT: ${{ inputs.experiment }}
        timeout-minutes: 150
        run: |
          case "$SIZE" in
            smoke) LIMIT=(--limit-days 5) ;;
            month) LIMIT=(--limit-days 30) ;;
            full)  LIMIT=() ;;
            *) echo "::error::unknown size '$SIZE'"; exit 1 ;;
          esac
          case "$EXPERIMENT" in
            cov-probe)        python run_covariates.py probe ;;
            cov-known-answer) python run_covariates.py known-answer --repo-id "$MODEL_REPO" --revision "$T0_REVISION" ;;
            cov-run)          python run_covariates.py run --repo-id "$MODEL_REPO" --revision "$T0_REVISION" "${LIMIT[@]}" ;;
            *) echo "::error::unknown experiment '$EXPERIMENT'"; exit 1 ;;
          esac

      - name: Run t0 strengths probes (Experiment 3)
        if: startsWith(inputs.experiment, 'probes')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SIZE: ${{ inputs.size }}
          EXPERIMENT: ${{ inputs.experiment }}
        timeout-minutes: 200
        run: |
          case "$SIZE" in
            smoke) LIMIT=(--limit-days 5) ;;
            month) LIMIT=(--limit-days 30) ;;
            full)  LIMIT=() ;;
            *) echo "::error::unknown size '$SIZE'"; exit 1 ;;
          esac
          case "$EXPERIMENT" in
            probes-check) python run_probes.py check ;;
            probes-run)   python run_probes.py run --repo-id "$MODEL_REPO" --revision "$T0_REVISION" "${LIMIT[@]}" ;;
            *) echo "::error::unknown experiment '$EXPERIMENT'"; exit 1 ;;
          esac

      - name: Confirm claim C1 (one shot on 2025; dry run on 2024)
        if: startsWith(inputs.experiment, 'confirm')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXPERIMENT: ${{ inputs.experiment }}
        timeout-minutes: 60
        run: |
          case "$EXPERIMENT" in
            confirm-dryrun-2024) python run_confirm.py --year 2024 --repo-id "$MODEL_REPO" --revision "$T0_REVISION" ;;
            confirm-2025)        python run_confirm.py --year 2025 --repo-id "$MODEL_REPO" --revision "$T0_REVISION" ;;
            *) echo "::error::unknown experiment '$EXPERIMENT'"; exit 1 ;;
          esac

      - name: Publish summary
        if: always()
        env:
          SIZE: ${{ inputs.size }}
        run: |
          if [ -f results/confirm/summary.md ]; then
            { echo "# Claim C1 confirmation"; echo; cat results/confirm/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f results/probes/summary.md ]; then
            { echo "# t0 strengths probes ($SIZE)"; echo; cat results/probes/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f results/covariates/summary.md ]; then
            { echo "# Covariate slice ($SIZE)"; echo; cat results/covariates/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f results/summary.md ]; then
            { echo "# Benchmark ($SIZE)"; echo; cat results/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No \`results/summary.md\` was produced - the run failed before writing results." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Echo tables to the log
        if: always()
        run: |
          # Collapsed groups: the numbers stay readable through the Actions API
          # (the artifact is not) without flooding the visible log.
          for f in results/metrics.csv results/ranking.csv results/pairwise.csv results/skill.csv \
                   results/by_month.csv results/by_slot.csv results/by_band.csv \
                   results/pairwise_by_month.csv results/pairwise_by_band.csv \
                   results/concentration.csv results/bootstrap_sensitivity.csv \
                   results/source_audit.csv results/night_zero_audit.csv \
                   results/night_zero_audit_by_slot.csv results/daytime_mask.csv \
                   results/readme_tables.md results/run_meta.json \
                   results/covariates/probe.json results/covariates/known_answer.json \
                   results/covariates/summary.md results/covariates/pairwise.csv \
                   results/covariates/ranking.csv results/covariates/metrics.csv \
                   results/covariates/source_audit.csv results/covariates/scored_days.csv \
                   results/covariates/run_meta.json \
                   results/probes/check.json results/probes/summary.md results/probes/probes.csv \
                   results/probes/coverage.csv results/probes/metrics_P1P2.csv results/probes/metrics_P3.csv \
                   results/probes/metrics_P4.csv results/probes/run_meta.json \
                   results/confirm/confirm.json results/confirm/summary.md; do
            if [ -f "$f" ]; then
              echo "::group::$f"; cat "$f"; echo "::endgroup::"
            fi
          done
          # The per-day frames are one row per day and method (3,267 rows each on
          # a full run), which alone would overflow the ~5,000-line window the
          # Actions API serves. Echo them pivoted to one row per day, rounded.
          for f in results/per_day_errors.csv results/per_day_errors_daytime.csv; do
            if [ -f "$f" ]; then
              echo "::group::${f%.csv}_wide.csv"
              python - "$f" <<'PY'
          import sys
          import pandas as pd
          df = pd.read_csv(sys.argv[1])
          wide = df.pivot(index="delivery_date", columns="method", values="sum_abs_err").round(3)
          wide.insert(0, "n", df.pivot(index="delivery_date", columns="method", values="n").iloc[:, 0].astype(int))
          sys.stdout.write(wide.to_csv())
          PY
              echo "::endgroup::"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.experiment == 'exp0' && format('results-{0}-{1}', inputs.size, github.run_number) || format('results-{0}-{1}-{2}', inputs.experiment, inputs.size, github.run_number) }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
