  research_w01:
    needs: [observe]
    if: inputs.mode == 'preflight' || inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research_loop_proof/phase0/truth/
            !/research_loop_proof/beta1/truth/
            !/research_loop_proof/learn1/truth/
            !/research_loop_proof/policy1/truth/
            !/research_loop_proof/discovery1/truth/
            !/research_loop_proof/human1/truth/
            !/research_loop_proof/kernel1/truth/
            !/tests/

      - name: Guard (no world generator or evaluator in this job)
        run: |
          set -euo pipefail
          for d in research_loop_proof/phase0/truth research_loop_proof/beta1/truth research_loop_proof/learn1/truth research_loop_proof/policy1/truth research_loop_proof/discovery1/truth research_loop_proof/human1/truth research_loop_proof/kernel1/truth tests; do
            if [ -e "$d" ]; then echo "::error::$d is present"; exit 1; fi
          done
          rm -rf .git
          if grep -rlE --include='*.py' '^def (make_world|pair_world|kernel_world)' . ; then echo "::error::generator code is present"; exit 1; fi
          mkdir -p research
          printf '{"truth_absent": true, "git_removed": true, "run_attempt": "%s"}\n' "$GITHUB_RUN_ATTEMPT" > research/guard.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (tfc-t0 0.5.0)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu -c research_loop_proof/beta1/constraints-beta.txt torch
          pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt tfc-t0 numpy pandas pyarrow matplotlib requests huggingface-hub safetensors pytest pyyaml
          pip install --no-cache-dir -r requirements-researcher.txt

      - uses: actions/download-artifact@v4
        with:
          name: kernel1-observed-w01-${{ github.run_id }}
          path: obs/w01

      - name: Weights (t0-beta, pinned bytes; ungated, no secret)
        run: python -m research_loop_proof.discovery1.lab.run weights --weights weights

      - name: AI researcher L8 (Discovery1's research job, unchanged), world w01 (the API key only here; weights offline)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          HF_HUB_OFFLINE: "1"
          OBS_SHA: ${{ needs.observe.outputs.observed_sha256_w01 }}
        run: |
          set -euo pipefail
          start=$(date -u +%s)
          python -m research_loop_proof.discovery1.lab.run loop --observed obs/w01/observed.npz --observed-sha "$OBS_SHA" --weights weights --out research
          end=$(date -u +%s)
          printf '{"loop_started_unix": %s, "loop_finished_unix": %s, "loop_wall_s": %s}\n' "$start" "$end" "$((end - start))" > research/timing.json

      - name: Manifest
        id: manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research
          cd research
          find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../MANIFEST.tmp
          mv ../MANIFEST.tmp MANIFEST.sha256
          cat MANIFEST.sha256
          echo "sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel1-research-w01-${{ github.run_id }}
          path: research/
          if-no-files-found: error
          retention-days: 30

