# Kernel1 (docs/research_loop_proof/NEXT_KERNEL_PROOF_PROMPT.md): a direct frozen test of Discovery1's researcher L8,
# unchanged, on twelve hidden worlds (8 change, 2 stable, 2 null; KERNEL1_SPEC.md).
#
# Manual only, one mode per dispatch. No cache is read or written. t0-beta jobs install
# research_loop_proof/beta1/constraints-beta.txt (tfc-t0 0.5.0), as beta1, learn1, policy1, discovery1 and human1 did.
#   preflight = one non-scored change world (operational check only: execution, schema, integrity), researched by L8 in
#               research_w01.
#   run       = the twelve scored worlds w01-w12 (seeds and kinds from kernel1_spec_sha and this run's id), only after a
#               published preflight PASS under the same kernel1_spec_sha (input preflight_run), only as the run's first
#               attempt and only if no scored Kernel1 run is published. observe exports days 1-126 of each world as its
#               own artifact; research_wNN (identical except for the world, without any truth on disk, in three waves of
#               four) downloads only its own world and runs Discovery1's research job unchanged
#               (research_loop_proof.discovery1.lab.run); evaluate reads all twelve.
# Results are published only by the publish job, which holds no secret: it checks the files against the hash the
# producing job declared and pushes them to a new orphan branch kernel1/run-<run id>, never overwriting one.
name: Research loop kernel1
run-name: kernel1 ${{ inputs.mode }} ${{ inputs.preflight_run }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preflight = non-scored operational check (one world); run = the frozen batch of twelve scored worlds
        type: choice
        required: true
        default: preflight
        options: [preflight, run]
      preflight_run:
        description: run only - the run id of the published preflight PASS (branch kernel1/run-<id>)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: research-loop-kernel1
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      observed_sha256_w01: ${{ steps.observe.outputs.w01 }}
      observed_sha256_w02: ${{ steps.observe.outputs.w02 }}
      observed_sha256_w03: ${{ steps.observe.outputs.w03 }}
      observed_sha256_w04: ${{ steps.observe.outputs.w04 }}
      observed_sha256_w05: ${{ steps.observe.outputs.w05 }}
      observed_sha256_w06: ${{ steps.observe.outputs.w06 }}
      observed_sha256_w07: ${{ steps.observe.outputs.w07 }}
      observed_sha256_w08: ${{ steps.observe.outputs.w08 }}
      observed_sha256_w09: ${{ steps.observe.outputs.w09 }}
      observed_sha256_w10: ${{ steps.observe.outputs.w10 }}
      observed_sha256_w11: ${{ steps.observe.outputs.w11 }}
      observed_sha256_w12: ${{ steps.observe.outputs.w12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -c research_loop_proof/beta1/constraints-beta.txt numpy pandas

      - name: Check the researcher model variable (by its sha256 against menu.json; nothing printed)
        env:
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          pin = json.load(open("research_loop_proof/phase0/lab/menu.json"))["researcher"]["model_sha256"]
          got = hashlib.sha256(os.environ.get("RESEARCHER_MODEL", "").strip().encode()).hexdigest()
          if got != pin:
              sys.exit("vars.RESEARCHER_MODEL does not hash to the pinned researcher model: refused")
          print("researcher model variable matches the pin")
          PY

      - name: Fetch the published preflight result and every published Kernel1 verdict (run mode)
        if: inputs.mode == 'run'
        env:
          PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        run: |
          set -euo pipefail
          case "$PREFLIGHT_RUN" in ''|*[!0-9]*) echo "::error::preflight_run must be the numeric run id of the preflight"; exit 1 ;; esac
          git fetch --depth=1 origin "refs/heads/kernel1/run-$PREFLIGHT_RUN"
          mkdir preflight published
          git show FETCH_HEAD:verdict.json > preflight/verdict.json
          git show FETCH_HEAD:MANIFEST.sha256 > preflight/MANIFEST.sha256
          cat preflight/verdict.json
          for ref in $(git ls-remote --heads origin 'refs/heads/kernel1/run-*' | cut -f2); do
            id="${ref#refs/heads/kernel1/run-}"
            git fetch --depth=1 origin "$ref"
            mkdir -p "published/$id"
            git show FETCH_HEAD:verdict.json > "published/$id/verdict.json"
          done
          ls published

      - name: Observe
        id: observe
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python -m research_loop_proof.kernel1.truth.observe --mode "$MODE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --preflight-dir preflight --published-dir published --out obs
          cat obs/shas.env >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'preflight' || inputs.mode == 'run'
        with:
          name: kernel1-observed-w01-${{ github.run_id }}
          path: obs/w01/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w02-${{ github.run_id }}
          path: obs/w02/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w03-${{ github.run_id }}
          path: obs/w03/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w04-${{ github.run_id }}
          path: obs/w04/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w05-${{ github.run_id }}
          path: obs/w05/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w06-${{ github.run_id }}
          path: obs/w06/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w07-${{ github.run_id }}
          path: obs/w07/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w08-${{ github.run_id }}
          path: obs/w08/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w09-${{ github.run_id }}
          path: obs/w09/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w10-${{ github.run_id }}
          path: obs/w10/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
          name: kernel1-observed-w11-${{ github.run_id }}
          path: obs/w11/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run'
        with:
